<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Track views, clicks and add-to-cart conversions for shoppable product videos."
    />
    <title>Shoppable Video Analytics</title>
    <script>
      // Applies the saved theme before first paint. Without this, a user who
      // chose dark sees a white flash while the React bundle loads.
      try {
        var saved = localStorage.getItem('svd-theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        /* localStorage unavailable; fall back to the OS preference. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
